name: Update repo.json

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fails the run (and skips the commit) if any tracked repo lacks a repo.json release asset.
      - name: Build repo.json
        run: |
          for repo in $(grep -v '^#' repos.txt); do
            curl -sSfL "https://github.com/$repo/releases/latest/download/repo.json" || exit 1
          done | jq -s 'add' > repo.json

      - name: Commit if changed
        run: |
          git add repo.json
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update repo.json'
          git push
